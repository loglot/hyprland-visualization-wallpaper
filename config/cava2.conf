[general]
framerate = 60
autosens = 1
overshoot = 0
bars = 0
bar_width = 3
bar_spacing = 1
lower_cutoff_freq = 10
higher_cutoff_freq = 18000
live-config = 1

[input]
sample_rate = 96000
sample_bits = 32
remix = 1

[output]
method = noncurses
orientation = bottom
channels = stereo
mono_option = average
synchronized_sync = 1
