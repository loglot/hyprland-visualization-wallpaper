[color]
gradient = 1
gradient_color_2 = '#ba2637'
gradient_color_1 = '#2f0439'
horizontal_gradient = 1
horizontal_gradient_color_1 = '#ba2637'
horizontal_gradient_color_2 = '#2f0439'

[smoothing]
monstercat = 0
waves = 0
noise_reduction = 11
